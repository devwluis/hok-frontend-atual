kind = "web"
previewPath = "/hok-os/"
title = "HOK OS"
version = "1.0.0"
id = "artifacts/hok-os"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/hok-os/" ]
localPort = 20166

[services.development]
run = "pnpm --filter @workspace/hok-os run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hok-os", "run", "build" ]
publicDir = "artifacts/hok-os/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20166"
BASE_PATH = "/hok-os/"
